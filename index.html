<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="description" content="سجل أوزاني: برنامج أرنولد خمسة أيام وسجل تمارين يعمل دون إنترنت"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>سجل أوزاني | Arnold 5 | ترتيب Excel</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#edf3ff}header{padding:24px 18px;background:linear-gradient(135deg,#182c48,#111827);border-bottom:1px solid #34465d}h1{margin:0 0 7px;font-size:25px}.sub{color:#aabbd1;font-size:13px}main{max-width:760px;margin:auto;padding:16px 14px 100px}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.tabs button{white-space:nowrap}button,.btn{border:1px solid #35465d;background:#1d2c43;color:#f5f9ff;border-radius:12px;padding:11px 13px;font:inherit;cursor:pointer}button.active,.primary{background:#0e9488;border-color:#0e9488;color:white}.panel{background:#152237;border:1px solid #304058;border-radius:16px;padding:15px;margin:13px 0}.exercise{border-top:1px solid #304058;padding:16px 0}.exercise:first-child{border-top:0}h2{font-size:19px;margin:0 0 9px}h3{font-size:16px;margin:0 0 8px}.meta{font-size:13px;color:#a8bcd4;line-height:1.9}.setrow{display:grid;grid-template-columns:32px 1fr 1fr 75px;gap:7px;align-items:end;margin:9px 0}.setrow label{font-size:11px;color:#b8c9df}input,select{width:100%;background:#0c1728;border:1px solid #41526a;border-radius:9px;padding:11px 7px;color:white;font:inherit;min-width:0}input[type=number]{direction:ltr;text-align:center}.setrow button{padding:10px 4px}.setrow button.done{background:#0e9488}small{color:#9db2cd}.toolbar{display:flex;flex-wrap:wrap;gap:8px}.muted{color:#b6c8de}.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kpi{background:#1c3047;border-radius:12px;padding:12px}.kpi strong{font-size:23px;display:block}.chart{width:100%;height:190px;background:#0d1a2c;border-radius:12px}#timer{font-variant-numeric:tabular-nums;font-size:36px;font-weight:700}footer{font-size:12px;color:#a4b5c8;padding:12px}a{color:#7be0d0}button:focus-visible,input:focus-visible{outline:2px solid #7be0d0}@media(min-width:600px){.kpis{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><h1>🏋️ سجل أوزاني</h1><div class="sub">Arnold Split • خمسة أيام • يعمل دون إنترنت بعد التثبيت</div></header><main><nav class="tabs" id="tabs"></nav><div id="content"></div></main><script src="data.js"></script><script>
const KEY='ahmad-arnold5-exact-v2';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};state.logs ||= {};state.history ||= [];let tab=0,timerRemaining=0,timerInterval=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(state))}function today(){return new Date().toLocaleDateString('en-CA')};function exerciseLog(id){return state.logs[id]||[]};function previous(id){let hist=state.history.filter(x=>x.id===id).sort((a,b)=>b.date.localeCompare(a.date));return hist.length?hist[0]:null}
function nav(){let labels=[...PROGRAM.map(x=>x.name),'التقدم','المؤقت','النسخ'];$('tabs').innerHTML=labels.map((x,i)=>`<button class="${tab===i?'active':''}" onclick="go(${i})">${esc(x)}</button>`).join('')};function go(i){tab=i;nav();render()};function render(){if(tab<5)return renderDay();if(tab===5)return renderProgress();if(tab===6)return renderTimer();return renderBackup()}
function renderDay(){let d=PROGRAM[tab],html=`<section class="panel"><h2>${esc(d.name)} — ${esc(d.subtitle)}</h2><div class="meta">${d.exercises.length} تمارين • سجّل كل مجموعة على حدة • RIR يعني التكرارات المتبقية قبل الفشل</div></section>`;for(let e of d.exercises){let sets=exerciseLog(e.id),prev=previous(e.id);html+=`<section class="panel exercise"><h3>${esc(e.name)}</h3><div class="meta">${e.sets} مجموعات × ${esc(e.reps)} تكرار • RIR ${esc(e.rir)} • راحة ${esc(e.rest)}${e.machine?' • جهاز '+esc(e.machine):''}</div><div class="meta">${e.previous?'📌 من ملف Excel: '+esc(e.previous):''}${prev?' • آخر تسجيل: '+esc(prev.date)+' — '+esc(prev.weight)+' '+esc(prev.unit):''}</div><div class="setrow"><small>رقم</small><label>الوزن</label><label>التكرارات</label><small>الحفظ</small></div>`;for(let i=0;i<e.sets;i++){let s=sets[i]||{};html+=`<div class="setrow"><b>${i+1}</b><input aria-label="وزن المجموعة ${i+1}" type="number" min="0" step="0.5" id="w-${e.id}-${i}" value="${esc(s.weight??'')}" placeholder="0"><input aria-label="تكرارات المجموعة ${i+1}" type="number" min="1" max="100" id="r-${e.id}-${i}" value="${esc(s.reps??'')}" placeholder="0"><button class="${s.done?'done':''}" onclick="record('${e.id}',${i})">${s.done?'✓':'حفظ'}</button></div>`}html+=`<div class="toolbar"><select aria-label="وحدة الوزن" id="u-${e.id}"><option value="KG" ${sets[0]?.unit==='LB'?'':'selected'}>KG كغ</option><option value="LB" ${sets[0]?.unit==='LB'?'selected':''}>LB رطل</option></select></div></section>`}$('content').innerHTML=html}
function record(id,i){let w=Number($(`w-${id}-${i}`).value),r=Number($(`r-${id}-${i}`).value),unit=$('u-'+id).value;if(!Number.isFinite(w)||w<=0||!Number.isInteger(r)||r<1){alert('أدخل وزنًا أكبر من صفر وعدد تكرارات صحيحًا');return}let arr=state.logs[id]||[];arr[i]={weight:w,reps:r,unit,done:true,date:today()};state.logs[id]=arr;state.history.push({id,set:i+1,weight:w,reps:r,unit,date:today(),at:new Date().toISOString()});save();renderDay()}
function renderProgress(){let total=state.history.length,unique=new Set(state.history.map(x=>x.id)).size;$('content').innerHTML=`<section class="panel"><h2>تقدمك التدريبي</h2><div class="kpis"><div class="kpi"><strong>${total}</strong><small>مجموعات مسجلة</small></div><div class="kpi"><strong>${unique}</strong><small>تمارين مسجلة</small></div></div></section><section class="panel"><h3>تطور الوزن لكل تمرين</h3><select id="chartExercise" onchange="drawChart()">${PROGRAM.flatMap(d=>d.exercises).filter((e,i,a)=>a.findIndex(t=>t.name===e.name)===i).map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select><p class="meta">الرسم يعرض أعلى وزن مسجل لكل يوم، مع فصل وحدتي KG وLB.</p><select id="chartUnit" onchange="drawChart()"><option>KG</option><option>LB</option></select><canvas class="chart" id="chart"></canvas><div id="chartInfo" class="meta"></div></section>`;drawChart()}
function drawChart(){let id=$('chartExercise').value,unit=$('chartUnit').value,ex=PROGRAM.flatMap(d=>d.exercises).find(e=>e.id===id),ids=PROGRAM.flatMap(d=>d.exercises).filter(e=>e.name===ex.name).map(e=>e.id),data=state.history.filter(x=>ids.includes(x.id)&&x.unit===unit),days={};data.forEach(x=>days[x.date]=Math.max(days[x.date]||0,x.weight));let points=Object.entries(days).sort((a,b)=>a[0].localeCompare(b[0])).slice(-20),c=$('chart'),ctx=c.getContext('2d'),width=c.clientWidth,height=190,dpr=window.devicePixelRatio||1;c.width=width*dpr;c.height=height*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,width,height);ctx.strokeStyle='#4b627d';ctx.beginPath();ctx.moveTo(36,12);ctx.lineTo(36,height-30);ctx.lineTo(width-12,height-30);ctx.stroke();if(!points.length){$('chartInfo').textContent='لا توجد بيانات بهذه الوحدة بعد';return}let max=Math.max(...points.map(p=>p[1]),1)*1.15;ctx.strokeStyle='#36d5bf';ctx.lineWidth=3;ctx.beginPath();points.forEach(([d,v],i)=>{let x=36+(width-52)*(points.length===1?.5:i/(points.length-1)),y=height-30-v/max*(height-55);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle='#d7e9fa';ctx.font='12px sans-serif';ctx.fillText('0',9,height-27);ctx.fillText(String(Math.round(max)),4,20);$('chartInfo').textContent=`${points.length} أيام مسجلة • آخر يوم ${points.at(-1)[0]} • أعلى وزن ${Math.max(...points.map(p=>p[1]))} ${unit}`}
function renderTimer(){$('content').innerHTML=`<section class="panel"><h2>مؤقت الراحة</h2><div id="timer">${fmt(timerRemaining)}</div><div class="toolbar"><button onclick="startTimer(90)">90 ثانية</button><button onclick="startTimer(120)">دقيقتان</button><button onclick="startTimer(180)">3 دقائق</button><button onclick="stopTimer()">إيقاف</button></div><p class="meta">المؤقت يعمل ما دامت صفحة التطبيق نشطة؛ قد يوقفه أندرويد عند إغلاق التطبيق.</p></section>`};function fmt(t){return `${Math.floor(t/60).toString().padStart(2,'0')}:${(t%60).toString().padStart(2,'0')}`};function startTimer(n){clearInterval(timerInterval);let end=Date.now()+n*1000;timerRemaining=n;renderTimer();timerInterval=setInterval(()=>{timerRemaining=Math.max(0,Math.ceil((end-Date.now())/1000));let el=$('timer');if(el)el.textContent=fmt(timerRemaining);if(!timerRemaining){clearInterval(timerInterval);if(navigator.vibrate)navigator.vibrate([150,100,150])}},300)}function stopTimer(){clearInterval(timerInterval);timerRemaining=0;renderTimer()}
function renderBackup(){$('content').innerHTML=`<section class="panel"><h2>النسخ الاحتياطي</h2><p class="muted">السجلات محفوظة على هذا الهاتف داخل المتصفح. حذف بيانات الموقع قد يحذفها؛ صدّر نسخة احتياطية بانتظام.</p><div class="toolbar"><button class="primary" onclick="exportData()">تصدير JSON</button><label class="btn">استيراد JSON<input type="file" accept="application/json,.json" onchange="importData(event)" style="display:none"></label></div></section><section class="panel"><h3>إعادة ضبط السجل</h3><button onclick="resetData()">حذف جميع السجلات</button></section>`};function exportData(){let a=document.createElement('a'),blob=new Blob([JSON.stringify({version:1,logs:state.logs,history:state.history},null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='gym-tracker-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}async function importData(ev){let file=ev.target.files[0];if(!file)return;try{let x=JSON.parse(await file.text());if(!x||!Array.isArray(x.history)||typeof x.logs!=='object'||!x.logs)throw Error();if(!confirm('سيستبدل الاستيراد سجلاتك الحالية. هل تريد المتابعة؟'))return;state={logs:x.logs,history:x.history};save();alert('تم الاستيراد');render()}catch{alert('ملف غير صالح')}}function resetData(){if(confirm('حذف جميع السجلات نهائيًا من هذا الجهاز؟')){state={logs:{},history:[]};save();render()}}
nav();render();if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
